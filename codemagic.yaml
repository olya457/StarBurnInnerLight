workflows:
  sample-workflow:
    name: StarBest Inner Light
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Star Burn Inner Light
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cerimolobev.becedilosov
      vars:
        APP_STORE_APPLE_ID: 6763020601
        BUNDLE_ID: 'com.cerimolobev.becedilosov'
        XCODE_WORKSPACE: 'StarBurnInnerLight.xcworkspace'
        XCODE_SCHEME: 'StarBurnInnerLight'
    scripts:
      - name: Install node modules
        script: |
          npm install
      - name: Configure React Native iOS environment
        script: |
          NODE_BINARY_PATH="$(command -v node)"
          echo "export NODE_BINARY=$NODE_BINARY_PATH" > "$CM_BUILD_DIR/ios/.xcode.env.local"
          echo "Using Node binary: $NODE_BINARY_PATH"
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up provisioning profile settings on  Xcode project
        script: |
          cd ios
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/StarBurnInnerLight.xcodeproj" \
            --archive-method app-store \
            --export-options-plist "$HOME/export_options.plist" \
            --code-signing-setup-verbose-logging
      - name: Increment build number
        script: |
          #!/bin/sh
          cd $CM_BUILD_DIR/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set Info.plist values
        script: |
          PLIST=$CM_BUILD_DIR/ios/StarBurnInnerLight/Info.plist
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          if $PLIST_BUDDY -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1; then
            $PLIST_BUDDY -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          else
            $PLIST_BUDDY -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          fi
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        copyright: SALVATORE LONGO
